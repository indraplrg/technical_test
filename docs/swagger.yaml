      summary: Create a new mahasiswa
      tags:
      - mahasiswa
  /mahasiswa/{id}:
    delete:
      description: Delete a mahasiswa record (soft delete)
      parameters:
      - description: Mahasiswa ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Result'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Result'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Result'
      summary: Delete mahasiswa
      tags:
      - mahasiswa
    get:
      description: Returns a single mahasiswa record
      parameters:
      - description: Mahasiswa ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:

    put:
      consumes:
      - application/json
      description: Update an existing mahasiswa record
      parameters:
      - description: Mahasiswa ID
        in: path
        name: id
        required: true
        type: integer
      - description: Mahasiswa payload
        in: body
        name: body
        required: true

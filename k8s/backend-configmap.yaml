apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: default
data:
  APP_NAME: student-management
  APP_ENV: production
  APP_PORT: "8080"
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: postgres
  DB_NAME: student_db
  DB_SSLMODE: disable
  DB_TIMEZONE: UTC
  CORS_ALLOWED_ORIGIN: "*"